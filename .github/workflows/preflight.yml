name: RedMagic source preflight (NOT a kernel build)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test artifact checker
        run: python3 -m unittest discover -s . -p "test_*.py" -v
      - name: Report unresolved source and KPM requirements
        run: python3 preflight.py
